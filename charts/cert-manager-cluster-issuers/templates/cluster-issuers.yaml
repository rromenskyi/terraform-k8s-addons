apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  {{- if .Values.commonLabels }}
  labels:
{{ toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.letsencrypt_email | quote }}
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: traefik
      {{- if and .Values.dns01.cloudflare.apiTokenSecretName .Values.dns01.cloudflare.dnsZones }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.dns01.cloudflare.apiTokenSecretName | quote }}
              key: api-token
        selector:
          dnsZones:
{{ toYaml .Values.dns01.cloudflare.dnsZones | indent 12 }}
      {{- end }}
---
apiVersion: cert-manager.io/v1
